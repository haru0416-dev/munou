name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.83.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt --component clippy
      - run: rustup default ${{ env.RUST_VERSION }}
      - run: rustc -vV && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p munou-cli --locked -- verify --sa-tokens 20000 --turns 40
      - run: cargo run -p munou-cli --locked -- probe --seed data/seed.jsonl
