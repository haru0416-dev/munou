<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工無脳君</title>
<meta name="description" content="LLMを使わない、閉じた決定的対話エンジン。すべてブラウザ内で動く。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext x='0' y='13' font-size='13'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #10130f;
  --panel: #181c16;
  --ink: #d6d3c4;
  --dim: #7d8272;
  --user: #9ec49a;
  --bot: #d6d3c4;
  --accent: #3c5a41;
  --line: #2a2e26;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.6 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  padding: .6rem .9rem;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
header h1 { font-size: 1rem; margin: 0 auto 0 0; font-weight: 700; }
header label { color: var(--dim); font-size: .8rem; }
header input[type="number"] {
  width: 5.5em; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; padding: .15rem .35rem;
  font: inherit; font-size: .85rem;
}
button {
  background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px;
  padding: .25rem .6rem; font: inherit; font-size: .85rem; cursor: pointer;
}
button:hover { border-color: var(--accent); }
main { flex: 1; overflow-y: auto; padding: 1rem .9rem 0; scroll-behavior: smooth; }
.chat { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: .45rem; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { color: var(--user); }
.msg.user::before { content: "> "; color: var(--dim); }
.msg.bot { color: var(--bot); }
.msg.note { color: var(--dim); font-size: .8rem; }
.msg.strip { color: var(--dim); font-size: .74rem; border-bottom: 1px dashed var(--line); padding-bottom: .45rem; }
pre.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: .7rem .8rem; font-size: .78rem; overflow-x: auto; margin: .2rem 0;
  white-space: pre;
}
form {
  display: flex; gap: .5rem; padding: .7rem .9rem calc(.7rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--panel);
}
form input[type="text"] {
  flex: 1; max-width: 46rem; margin-left: auto;
  background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: .5rem .7rem; font: inherit;
}
form input[type="text"]:focus { outline: 1px solid var(--accent); }
form button { margin-right: auto; }
.intro { color: var(--dim); font-size: .8rem; }
.intro a { color: var(--user); }
</style>
</head>
<body>
<header>
  <h1>人工無脳君</h1>
  <label>seed <input id="seed" type="number" value="1" min="0" step="1" inputmode="numeric"></label>
  <button id="btn-observe" type="button">観察窓</button>
  <button id="btn-ayumi" type="button">あゆみ</button>
  <button id="btn-why" type="button">/why</button>
  <button id="btn-good" type="button">/good</button>
  <button id="btn-bad" type="button">/bad</button>
  <button id="btn-reset" type="button">リセット</button>
</header>
<main>
  <div class="chat" id="chat" aria-live="polite">
    <p class="intro">LLMなし・サーバなし。エンジンは WebAssembly でこのページ内だけで動き、
会話ログは端末の localStorage に残ります（外に出ません）。話しかけるほど、あなたのログから育ちます。
<a href="https://github.com/haru0416-dev/munou">ソース</a></p>
  </div>
</main>
<form id="form">
  <input id="input" type="text" autocomplete="off" enterkeyhint="send"
         placeholder="話しかける…" aria-label="発話入力" disabled>
  <button type="submit" id="send" disabled>送信</button>
</form>
<script src="app.js"></script>
</body>
</html>
