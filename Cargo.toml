[workspace]
resolver = "2"
members = ["crates/munou-engine", "crates/munou-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Haru"]
repository = "https://github.com/haru0416-dev/munou"

[workspace.dependencies]
munou-engine = { path = "crates/munou-engine" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = "0.10"
rand_chacha = "0.10"
rustc-hash = "2"
clap = { version = "=4.6.6", features = ["derive", "env"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
